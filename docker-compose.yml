version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tealus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tealus
      POSTGRES_PASSWORD: tealus_dev
      POSTGRES_DB: tealus
    ports:
      # ★ 自分のマシンからだけ受ける (2026-09-28)。以前は全部の口で待ち受け、LAN から届く設定だった
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ★ #557 migrations は initdb で流さない (台帳 schema_migrations が作られず、次の npm run migrate が止まった)。
      #   初回も npm run migrate で入れる (full は server の起動時に migrate が先に走る)

  postgres_test:
    image: postgres:16-alpine
    container_name: tealus_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: tealus_test
      POSTGRES_PASSWORD: tealus_test
      POSTGRES_DB: tealus_test
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  pgdata:
